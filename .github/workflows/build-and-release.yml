name: Build and Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Workspace repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Mimesis-Workspace
          path: Workspace
          ssh-key: ${{ secrets.WORKSPACE_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify version in csproj matches the tag
        id: version-check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CS_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" InventoryExpansion.csproj)
          if [ "$TAG_VERSION" != "$CS_VERSION" ]; then
            echo "Version mismatch: Tag version is $TAG_VERSION, but csproj version is $CS_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sed -n '2p')
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Previous tag: $PREVIOUS_TAG"
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes documented"
          fi
          
          # Create changelog content
          CHANGELOG_CONTENT="# Changelog

          ## Version $TAG_VERSION

          $CHANGELOG
          "
          
          # Update or create CHANGELOG.md
          if [ -f "thunderstore/CHANGELOG.md" ]; then
            # Prepend new version to existing changelog
            echo "$CHANGELOG_CONTENT" > thunderstore/CHANGELOG.md.new
            tail -n +2 thunderstore/CHANGELOG.md >> thunderstore/CHANGELOG.md.new
            mv thunderstore/CHANGELOG.md.new thunderstore/CHANGELOG.md
          else
            echo "$CHANGELOG_CONTENT" > thunderstore/CHANGELOG.md
          fi
          
          # Output changelog for release notes
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build the project
        run: dotnet build --configuration Release /p:GameManagedPath="${{ github.workspace }}/Workspace/lib/game" /p:MelonLoaderPath="${{ github.workspace }}/Workspace/lib/melonloader"

      - name: Prepare release directory
        run: |
          mkdir -p release
          cp bin/Release/netstandard2.1/InventoryExpansion.dll release/
          if [ -d "thunderstore" ]; then
            cp -r thunderstore/* release/ 2>/dev/null || true
            # Update version in manifest.json if it exists
            if [ -f "release/manifest.json" ]; then
              sed -i "s/\"version_number\": \".*\"/\"version_number\": \"${{ steps.version-check.outputs.version }}\"/" release/manifest.json
            fi
            # Ensure CHANGELOG.md is included
            if [ -f "thunderstore/CHANGELOG.md" ]; then
              cp thunderstore/CHANGELOG.md release/
            fi
            # Recreate README.md as UTF-8 without BOM
            if [ -f "thunderstore/README.md" ]; then
              cat thunderstore/README.md | iconv -f UTF-8 -t UTF-8//IGNORE > release/README.md 2>/dev/null || \
              sed '1s/^\xEF\xBB\xBF//' thunderstore/README.md > release/README.md || \
              cp thunderstore/README.md release/README.md
            fi
          fi

      - name: Create release ZIP
        run: zip -j "InventoryExpansion_${{ steps.version-check.outputs.version }}.zip" release/*

      - name: Upload Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: InventoryExpansion
          path: "InventoryExpansion_${{ steps.version-check.outputs.version }}.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: InventoryExpansion

      - name: Checkout code for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog for release
        id: changelog-release
        run: |
          TAG_VERSION="${{ needs.build.outputs.version }}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sed -n '2p')
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Previous tag: $PREVIOUS_TAG"
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes documented"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: InventoryExpansion

      - name: Extract DLL from ZIP
        run: |
          unzip -q "InventoryExpansion_${{ needs.build.outputs.version }}.zip" -d release/
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release/InventoryExpansion.dll
          body: |
            ## Changes in ${{ needs.build.outputs.version }}

            ${{ steps.changelog-release.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Discord renders a `release` webhook as an empty box - no title, no version, no notes. So the embed is
      # built here, where the version and the changelog section are already known. Skipped when the secret is
      # not set, so a fork or a repo without the feed just builds and releases.
      - name: Announce the release in Discord
        if: ${{ !cancelled() }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ needs.build.outputs.notes }}
          REPO: ${{ github.repository }}
          NEXUS_MOD_ID: ${{ secrets.NEXUS_MOD_ID }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_RELEASE_WEBHOOK is not set - nothing announced."; exit 0; fi

          SHORT="${REPO#*/}"
          NAME=$(echo "$SHORT" | sed -E 's/^(ScheduleOne|Palworld|Mimesis)-//')
          [ -f thunderstore/manifest.json ] && NAME=$(jq -r '.name // empty' thunderstore/manifest.json)
          [ -z "$NAME" ] && NAME="$SHORT"

          LINKS="[GitHub](https://github.com/$REPO/releases/tag/v$VERSION)"
          if [ -f thunderstore/manifest.json ]; then
            LINKS="[Thunderstore](https://thunderstore.io/package/DooDesch/$NAME/) · $LINKS"
          fi

          # NEXUS_MOD_ID is the global uid, game_id * 2^32 + page_id, and the page id is what the URL wants.
          # Only Schedule I is mapped, so a repo for another game simply goes without the link.
          if [ -n "$NEXUS_MOD_ID" ]; then
            GAME_ID=$(( NEXUS_MOD_ID / 4294967296 ))
            PAGE_ID=$(( NEXUS_MOD_ID % 4294967296 ))
            if [ "$GAME_ID" = "7381" ]; then
              LINKS="[Nexus](https://www.nexusmods.com/schedule1/mods/$PAGE_ID) · $LINKS"
            fi
          fi

          case "$SHORT" in
            ScheduleOne-*) FOOTER="Schedule I · $SHORT" ;;
            Palworld-*)    FOOTER="Palworld · $SHORT" ;;
            Mimesis-*)     FOOTER="Mimesis · $SHORT" ;;
            *)             FOOTER="$SHORT" ;;
          esac

          # jq builds the JSON so a changelog with quotes, backticks or newlines cannot break the payload.
          jq -n --arg title "$NAME $VERSION" \
                --arg url "https://github.com/$REPO/releases/tag/v$VERSION" \
                --arg desc "$NOTES" \
                --arg icon "https://raw.githubusercontent.com/$REPO/main/thunderstore/icon.png" \
                --arg links "$LINKS" \
                --arg foot "$FOOTER" \
            '{embeds: [{
                title: $title,
                url: $url,
                description: ($desc | if length > 1400 then .[0:1400] + "\n..." else . end),
                color: 8256434,
                thumbnail: {url: $icon},
                fields: [{name: "Get it", value: $links}],
                footer: {text: $foot}
             }]}' > payload.json

          curl -sS -f -X POST -H "Content-Type: application/json" -d @payload.json "$WEBHOOK" \
            && echo "announced $NAME $VERSION"

  thunderstore:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: InventoryExpansion

      - name: Extract ZIP for Thunderstore
        run: |
          mkdir -p thunderstore-package
          unzip -q "InventoryExpansion_${{ needs.build.outputs.version }}.zip" -d thunderstore-package/
          

      - name: Upload to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: mimesis
          namespace: DooDesch
          name: InventoryExpansion
          description: Expand your inventory with additional backpack slots. Toggle between standard inventory and backpack with a configurable key.
          version: ${{ needs.build.outputs.version }}
          repo: mimesis.thunderstore.io
          path: thunderstore-package
          categories: |
            Mods

